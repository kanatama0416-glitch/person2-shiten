<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — 02</title>
<style>html,body{margin:0;min-height:100%;background:#f4f4f1}</style>
</head>
<body>
<script>
(async()=>{
  try{
    let source=await(await fetch('https://raw.githubusercontent.com/kanatama0416-glitch/person2-shiten/57c51c14543080d8b8f2ef5a0a1164bbccabf582/index.html',{cache:'no-store'})).text();
    const pattern=/document\.open\(\);document\.write\(html\);document\.close\(\);?/;
    if(!pattern.test(source))throw new Error('patch marker not found');

    const guideAddon=`<style>
.room-food.shiten-feed-guide{z-index:40}
.room-food.shiten-feed-guide::before{content:'↑ この目玉をペットに運んでね';position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);z-index:60;pointer-events:none;white-space:nowrap;padding:7px 10px;border:2px solid #111;border-radius:999px;background:#111;color:#fff;box-shadow:3px 3px 0 var(--room-blue);font:800 12px/1.2 -apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;letter-spacing:.01em;animation:shitenFeedGuideBob .9s ease-in-out infinite alternate}
.room-food.shiten-feed-guide::after{content:'';position:absolute;left:50%;top:-7px;z-index:59;width:10px;height:10px;background:#111;transform:translateX(-50%) rotate(45deg);pointer-events:none}
@keyframes shitenFeedGuideBob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-4px)}}
@media(prefers-reduced-motion:reduce){.room-food.shiten-feed-guide::before{animation:none}}
</style><script>
(function(){
  var room=document.getElementById('eyeRoom');
  if(!room)return;
  var tray=room.querySelector('.room-tray');
  var launcher=document.getElementById('secretToggle');
  var spawnButton=room.querySelector('.room-spawn');
  var guideTimer=null;
  function clearGuide(){
    if(guideTimer){clearTimeout(guideTimer);guideTimer=null;}
    room.querySelectorAll('.room-food.shiten-feed-guide').forEach(function(el){el.classList.remove('shiten-feed-guide');});
  }
  function showGuide(){
    clearGuide();
    if(!room.open||room.classList.contains('stage-30'))return;
    var foods=tray?tray.querySelectorAll('.room-food'):[];
    if(!foods.length)return;
    var food=foods[Math.floor(foods.length/2)];
    if(food)food.classList.add('shiten-feed-guide');
  }
  function scheduleGuide(){
    clearGuide();
    if(!room.open||room.classList.contains('stage-30'))return;
    guideTimer=setTimeout(showGuide,2000);
  }
  room.addEventListener('pointerdown',clearGuide,true);
  room.addEventListener('pointerup',scheduleGuide,true);
  room.addEventListener('pointercancel',scheduleGuide,true);
  room.addEventListener('keydown',function(){clearGuide();setTimeout(scheduleGuide,0);},true);
  room.addEventListener('close',clearGuide);
  if(launcher)launcher.addEventListener('click',function(){setTimeout(scheduleGuide,0);});
  if(spawnButton)spawnButton.addEventListener('click',function(){setTimeout(scheduleGuide,0);});
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#secretToggle,#tearToggle');if(b)window.scrollTo(0,0)},true);
})();
<\/script>`;

    const hook=`html=html.replace('</body>',${JSON.stringify(guideAddon)}+'</body>');`;
    source=source.replace(pattern,m=>hook+m);
    document.open();document.write(source);document.close();
  }catch(e){
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
  }
})();
</script>
</body>
</html>
