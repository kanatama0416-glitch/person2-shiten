ale(1)',opacity:1},\n        {transform:`translate(${b.left + b.width/2 - a.left - a.width/2}px,${b.top + b.height/2 - a.top - a.height/2}px) scale(.1)`,opacity:0}\n      ], {duration:330,easing:'ease-in',fill:'forwards'});\n      animation.onfinish = () => ghost.remove();\n    }\n    food.remove();\n    eaten += 1;\n    count.textContent = String(eaten);\n    status.textContent = ['もぐもぐ。','おいしい。もうひとつ？','じーっ。ありがとう。','なんだか、ごきげん。'][((eaten-1)%4)];\n    pet.setAttribute('aria-label', 'ごはんを食べて喜ぶ大きな目玉');\n    pet.classList.remove('eating');\n    void pet.offsetWidth;\n    pet.classList.add('eating');\n    clearTimeout(timer);\n    timer = setTimeout(() => pet.classList.remove('eating'), 700);\n    if (!reduced.matches) {\n      const spark = document.createElement('span');\n      spark.className = 'room-spark';\n      spark.textContent = '♪';\n      spark.setAttribute('aria-hidden', 'true');\n      room.querySelector('.room-scene').append(spark);\n      spark.addEventListener('animationend', () => spark.remove(), {once:true});\n    }\n    emptyState();\n    if (returnFocus) spawnButton.focus({preventScroll:true});\n  }\n  function spawn() {\n    if (tray.querySelectorAll('.room-food').length >= 5) {\n      status.textContent = 'お皿がいっぱい。ひとつ食べさせてね。';\n      return;\n    }\n    tray.querySelector('.room-empty')?.remove();\n    const food = document.createElement('button');\n    food.type = 'button';\n    food.className = 'room-food';\n    food.style.setProperty('--food-color', colors[born++ % colors.length]);\n    food.setAttribute('aria-label', '小さな目玉を食べさせる');\n    food.innerHTML = '<span class=\"room-food-eye\" aria-hidden=\"true\"></span>';\n    let suppressClick = false;\n    food.addEventListener('click', () => { if (suppressClick) { suppressClick = false; return; } feed(food); });\n    food.addEventListener('pointerdown', e => {\n      if (e.button !== 0 || !e.isPrimary || drag) return;\n      suppressClick = false;\n      drag = {food, id:e.pointerId, x:e.clientX, y:     spawn();\n  });\n  spawnButton.addEventListener('click', spawn);\n  room.querySelector('.room-close').addEventListener('click', () => room.close());\n  room.addEventListener('close', () => {\n    resetDrag();\n    room.querySelectorAll('.flying').forEach(el => el.remove());\n    document.body.style.overflow = oldOverflow;\n    launcher.focus({preventScroll:true});\n  });\n  let backdropDown = false;\n  const outside = e => { const r = room.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };\n  room.addEventListener('pointerdown', e => {backdropDown = e.target === room && outside(e);});\n  room.addEventListener('click', e => { if (e.target === room && backdropDown && outside(e)) room.close(); backdropDown = false; });\n  emptyState();\n}\n\ninstallEyeRoom();"+'<'+ '/script></body>');document.open();document.write(html);document.close()}catch(e){document.body.style.visibility='visible';document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>'}})();
