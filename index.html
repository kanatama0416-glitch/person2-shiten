<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — 02</title>
<style>html,body{margin:0;min-height:100%;background:#f4f4f1}</style>
</head>
<body>
<script>
(async()=>{
  try{
    let source=await(await fetch('./core.html',{cache:'no-store'})).text();
    source=source.replace('https://raw.githubusercontent.com/kanatama0416-glitch/person1-shiten/93246663e808f739feba769129b4593087c794cf/index.html','https://kanatama0416-glitch.github.io/person1-shiten/base.html');
    source=source.replace('function stageFor(n){return n>=30?30:n>=20?20:n>=10?10:0;}','function stageFor(n){return n>=15?30:n>=10?20:n>=5?10:0;}');
    source=source.replace("level.textContent='Lv.'+stage","level.textContent='Lv.'+Math.min(eaten,15)");
    source=source.replace('10こで進化。まだ育つかも。','5こで進化。まだ育つかも。');
    source=source.replace('20こで次の進化。','10こで次の進化。');
    source=source.replace('30こで最終進化。','15こで最終進化。');
    const pattern=/document\.open\(\);document\.write\(html\);document\.close\(\);?/;
    if(!pattern.test(source))throw new Error('patch marker not found');
    const intro=`<script>(function(){var i=document.getElementById('intro');if(!i||!document.body.classList.contains('intro-lock'))return;var n=Date.now(),r=false;try{var l=parseInt(localStorage.getItem('shiten-intro-last-seen-v3')||'0',10)||0;r=l>0&&(n-l)<1800000;localStorage.setItem('shiten-intro-last-seen-v3',String(n))}catch(e){}var d=r?650:1700,f=Math.max(120,d-280),p=document.querySelector('.page');function x(){[i,p,document.getElementById('introEye'),document.getElementById('introBrand'),document.getElementById('introRays')].forEach(function(e){if(e&&e.getAnimations)e.getAnimations().forEach(function(a){try{a.cancel()}catch(_){}})});document.body.classList.remove('intro-lock');if(p){p.style.opacity='1';p.style.filter='none'}if(i&&i.isConnected)i.remove();document.dispatchEvent(new CustomEvent('shiten:intro-end'))}i.style.transition='opacity .28s ease';setTimeout(function(){if(i&&i.isConnected)i.style.opacity='0'},f);setTimeout(x,d)})();<\/script>`;
    const hook=`html=html.replace('</body>','<script>document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#secretToggle,#tearToggle");if(b)window.scrollTo(0,0)},true);<\\/script>'+${JSON.stringify(intro)}+'<script src="https://kanatama0416-glitch.github.io/person2-shiten/room-guide.js?v=20260916"><\\/script><script src="https://kanatama0416-glitch.github.io/person1-shiten/eye-attract.js?v=20260916-stable"><\\/script></body>');`;
    source=source.replace(pattern,m=>hook+m);
    document.open();document.write(source);document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
  }
})();
</script>
</body>
</html>
