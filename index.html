<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — 水色版</title>
<style>html,body{margin:0;min-height:100%;background:#f4f4f1}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#111;font-weight:700}.loading i{display:block;width:90px;height:54px;border:3px solid #111;border-radius:50%;background:#fff;position:relative}.loading i:after{content:"";position:absolute;width:30px;height:30px;border:3px solid #111;border-radius:50%;background:#58c8ff;left:27px;top:9px}</style>
</head>
<body><div class="loading"><div><i></i><div style="margin-top:14px;text-align:center">SHITEN</div></div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/kanatama0416-glitch/shiten-test2/93246663e808f739feba769129b4593087c794cf/index.html';
  try{
    let html=await (await fetch(source,{cache:'no-store'})).text();
    html=html
      .replaceAll('#ff4f87','#58c8ff')
      .replaceAll('rgba(255,79,135,.42)','rgba(88,200,255,.42)')
      .replaceAll('rgba(255,79,135,.32)','rgba(88,200,255,.32)');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="loading">ページを読み込めませんでした。</div>'}
})();
</script>
</body>
</html>
