<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — 02</title>
<style>html,body{margin:0;min-height:100%;background:#f4f4f1}</style>
</head>
<body>
<script>
(async()=>{
  try{
    let source=await(await fetch('./core.html',{cache:'no-store'})).text();
    source=source.replace('https://raw.githubusercontent.com/kanatama0416-glitch/person1-shiten/93246663e808f739feba769129b4593087c794cf/index.html','https://kanatama0416-glitch.github.io/person1-shiten/base.html');
    const styleMarker="html=html.replace('<style>'";
    const timingPatch="html=html.replace('},1050);introEye.animate','},250);introEye.animate').replaceAll('duration:1650,delay:1250','duration:650,delay:250').replace('duration:1450,delay:1500','duration:600,delay:300').replace('},2980)','},1050)');";
    if(!source.includes(styleMarker))throw new Error('intro timing marker not found');
    source=source.replace(styleMarker,timingPatch+styleMarker);
    source=source.replace('function stageFor(n){return n>=30?30:n>=20?20:n>=10?10:0;}','function stageFor(n){return n>=10?30:n>=5?20:n>=2?10:0;}');
    source=source.replace("level.textContent='Lv.'+stage","level.textContent='Lv.'+Math.min(eaten,10)");
    source=source.replace('10こで進化。まだ育つかも。','2こで進化。まだ育つかも。');
    source=source.replace('20こで次の進化。','5こで次の進化。');
    source=source.replace('30こで最終進化。','10こで最終進化。');
    const pattern=/document\.open\(\);document\.write\(html\);document\.close\(\);?/;
    if(!pattern.test(source))throw new Error('patch marker not found');
    const hook=`const creatorCss='<style>.creator-signature{display:flex;flex-direction:row-reverse;align-items:flex-end;justify-content:center;gap:5px;width:max-content;max-width:100%;margin:22px auto 0;padding:5px 7px 7px}.creator-spine{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:44px;height:224px;padding:12px 5px 10px;border:3px solid var(--k);border-radius:7px 7px 4px 4px;box-shadow:3px 3px 0 var(--k);background:#fff;transform-origin:bottom center}.creator-spine__text{writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;font-size:14px;line-height:1.5;font-weight:800;letter-spacing:.02em;text-align:start}.creator-spine__text span{text-combine-upright:all}.creator-spine__label{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:10px;line-height:1.2;font-weight:800;letter-spacing:.08em;writing-mode:horizontal-tb}.creator-spine--name .creator-spine__text,.creator-spine--role .creator-spine__text{margin-top:20px}.creator-spine__icon{display:block;flex:none;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.creator-spine--name{height:194px;width:48px;background:var(--p);transform:rotate(2deg)}.creator-spine--name .creator-spine__text{font-size:19px;font-weight:900;letter-spacing:.12em}.creator-spine--role{height:232px;background:#fff;transform:rotate(-1deg)}.creator-spine--bio{height:250px;width:67px;background:var(--k);color:#fff;transform:rotate(-2deg)}.creator-spine--bio .creator-spine__text{font-weight:700;line-height:1.65;letter-spacing:0}</style>';html=html.replace('</head>',creatorCss+'</head>');const creatorSignature='<div class="creator-signature" aria-label="この視点を書いた人（仮の紹介）"><div class="creator-spine creator-spine--name"><span class="creator-spine__label">名前</span><div class="creator-spine__text">そら（仮）</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c4-8 16-8 20 0-4 8-16 8-20 0Z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></div><div class="creator-spine creator-spine--role"><span class="creator-spine__label">担当</span><div class="creator-spine__text">イベント企画（仮）</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 2v4m8-4v4M7 10h10"/></svg></div><div class="creator-spine creator-spine--bio"><div class="creator-spine__text">青いものを集めがち。<br>休日は喫茶店を歩きます。</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h12v8a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5Z"/><path d="M16 9h2a3 3 0 0 1 0 6h-2"/></svg></div></div>';html=html.replace(/(<section class="hero">[\\s\\S]*?<h1>[\\s\\S]*?<\\/h1>)/i,(match)=>match+creatorSignature);html=html.replace('</body>','<script>document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#secretToggle,#tearToggle");if(b)window.scrollTo(0,0)},true);<\\/script><script src="https://kanatama0416-glitch.github.io/person2-shiten/room-guide.js?v=20260916"><\\/script><script src="https://kanatama0416-glitch.github.io/person1-shiten/eye-attract.js?v=20260916-stable"><\\/script></body>');`;
    source=source.replace(pattern,m=>hook+m);
    document.open();document.write(source);document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
  }
})();
</script>
</body>
</html>
