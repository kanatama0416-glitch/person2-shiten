<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f4f1"><title>視展 — 02</title><style>html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;background:#f4f4f1}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#111;font-weight:700}.loading i{display:block;width:90px;height:54px;border:3px solid #111;border-radius:50%;background:#fff;position:relative}.loading i:after{content:"";position:absolute;width:30px;height:30px;border:3px solid #111;border-radius:50%;background:#58c8ff;left:27px;top:9px}</style></head><body><div class="loading"><div><i></i><div style="margin-top:14px;text-align:center">SHITEN</div></div></div><script>
(async()=>{const accent='#58c8ff',rgba42='rgba(88,200,255,.42)',rgba32='rgba(88,200,255,.32)',current=2;const pages=['https://kanatama0416-glitch.github.io/person1-shiten/','https://kanatama0416-glitch.github.io/person2-shiten/','https://kanatama0416-glitch.github.io/person3-shiten/','https://kanatama0416-glitch.github.io/person4-shiten/','https://kanatama0416-glitch.github.io/person5-shiten/'];try{let html=await(await fetch('https://raw.githubusercontent.com/kanatama0416-glitch/person1-shiten/93246663e808f739feba769129b4593087c794cf/index.html',{cache:'no-store'})).text();html=html.replace('<style>','<style>html,body{max-width:100%;overflow-x:hidden!important;overscroll-behavior-x:none}');html=html.replaceAll('#ff4f8755',accent+'55').replaceAll('#ff4f87',accent).replaceAll('rgba(255,79,135,.42)',rgba42).replaceAll('rgba(255,79,135,.32)',rgba32);
// Navigation is rewritten by position instead of fragile filename replacements.
let navIndex=0;html=html.replace(/<a class="v" href="[^"]*"(?: aria-current="page")?>/g,()=>{const i=navIndex++;return `<a class="v" href="${pages[i]}"${i===current-1?' aria-current="page"':''}>`});
// Keep the five navigation eyes' own colors independent from this page's blue accent.
html=html.replace('</style>',`.v:nth-child(1){--eye-color:#ff4f87!important}.v:nth-child(2){--eye-color:#58c8ff!important}.v:nth-child(3){--eye-color:#ffd83d!important}.v:nth-child(4){--eye-color:#70dc8b!important}.v:nth-child(5){--eye-color:#9b7cff!important}.v:first-child b{color:#111!important}.v:nth-child(${current}) b{color:${accent}!important}.v:first-child:before{display:none!important}.v:nth-child(${current}):before{content:"NOW";position:absolute;z-index:6;top:-7px;right:-2px;background:#111;color:#fff;border-radius:99px;padding:1px 5px;font:900 7px Arial;letter-spacing:.08em;display:block!important}</style>`);
document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading">ページを読み込めませんでした。</div>'}})();
</script></body></html>
