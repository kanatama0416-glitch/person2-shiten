name: Deploy Water Blue Shiten

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare current site with 5-feed evolution milestones
        run: |
          BASE=57c51c14543080d8b8f2ef5a0a1164bbccabf582
          git fetch --depth=1 origin "$BASE"
          git show "$BASE:index.html" > index.html
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Keep the current tap behavior from the latest wrapper change.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = 'document.open();document.write(html);document.close();'
          if marker not in text:
              raise SystemExit('scroll patch marker missing')
          scroll_patch = "html=html.replace('id=\"secretToggle\"','id=\"secretToggle\" onpointerdown=\"window.scrollTo(0,0)\"').replace('id=\"tearToggle\"','id=\"tearToggle\" onpointerdown=\"window.scrollTo(0,0)\"');" + marker
          text = text.replace(marker, scroll_patch)
          index.write_text(text, encoding='utf-8')

          # Evolution milestones: same three visuals, reached after 5 / 10 / 15 feeds.
          replace_required(
              'build-stage10.js',
              'function shitenStageFor(n){return n>=30?30:n>=20?20:n>=10?10:0;}',
              'function shitenStageFor(n){return n>=15?30:n>=10?20:n>=5?10:0;}'
          )
          replace_required('build-stage10.js', "next.textContent='20こで次の進化。'", "next.textContent='10こで次の進化。'")
          replace_required('build-stage10.js', "next.textContent='30こで最終進化。'", "next.textContent='15こで最終進化。'")

          replace_required('index.html', "level.textContent='Lv.'+stage", "level.textContent='Lv.'+(stage===30?15:stage===20?10:stage===10?5:0)")
          replace_required('index.html', '10こで進化。まだ育つかも。', '5こで進化。まだ育つかも。')
          replace_required('index.html', '20こで次の進化。', '10こで次の進化。')
          replace_required('index.html', '30こで最終進化。', '15こで最終進化。')

          # Keep the browser verification aligned with the new feed counts.
          replace_required(
              'browser-check.py',
              'expected = 30 if count >= 30 else 20 if count >= 20 else 10 if count >= 10 else 0',
              'expected = 30 if count >= 15 else 20 if count >= 10 else 10 if count >= 5 else 0'
          )
          replace_required('browser-check.py', 'for count in (0, 10, 20, 30):', 'for count in (0, 5, 10, 15):')
          replace_required('browser-check.py', '    set_count(10)\n', '    set_count(5)\n')
          replace_required('browser-check.py', '    set_count(9)\n', '    set_count(4)\n')
          replace_required("browser-check.py", "localStorage.getItem(arguments[0])==='10'", "localStorage.getItem(arguments[0])==='5'")
          replace_required('browser-check.py', '    set_count(30)\n', '    set_count(15)\n')
          PY

      - name: Build and validate site
        run: node build-stage10.js

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium

      - name: Verify mobile pet behavior in Chrome
        run: |
          python -m http.server 8000 --directory public >/tmp/shiten-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python browser-check.py

      - name: Upload local browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots-local
          path: browser-check-screenshots
          if-no-files-found: ignore

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed GitHub Pages in Chrome
        env:
          SHITEN_TEST_URL: ${{ steps.deployment.outputs.page_url }}
          SHITEN_SCREEN_DIR: deployed-browser-check-screenshots
        run: python browser-check.py

      - name: Upload deployed browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots-deployed
          path: deployed-browser-check-screenshots
          if-no-files-found: ignore
