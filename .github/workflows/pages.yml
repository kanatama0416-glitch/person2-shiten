name: Deploy Water Blue Shiten
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch level 10 sprouting eyes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          marker = '/* STAGE10_SPROUT_FROM_MAIN_EYE_V2 */'

          if marker not in s:
              old_css_pattern = re.compile(
                  r"\.bud-eye\{z-index:2\}.*?\.s7\{right:87px;bottom:34px;transform:rotate\(-145deg\)\}",
                  re.S,
              )
              new_css = r'''/* STAGE10_SPROUT_FROM_MAIN_EYE_V2 */
          .stage-10 .room-evolution{top:46%;width:260px;height:190px}
          .bud-eye{z-index:3}
          .bud-eye:before{box-shadow:0 0 0 0 #111}
          .bud-eye:where(.b1,.b2,.b3):after{box-shadow:5px -6px 0 -3px #fff}
          .b1{left:12px;top:88px;transform:rotate(-9deg)}
          .b2{left:58px;top:34px;transform:rotate(-11deg)}
          .b3{left:116px;top:4px;transform:rotate(2deg)}
          .b4{right:56px;top:34px;transform:rotate(11deg)}
          .b5{right:12px;top:86px;transform:rotate(9deg)}
          .b6{right:10px;top:130px;transform:rotate(4deg)}
          .bud-stem{position:absolute;width:6px;background:#111;border-radius:99px;transform-origin:50% 100%;z-index:1}
          .bud-stem:after{content:'';position:absolute;left:50%;bottom:-3px;width:10px;height:10px;background:#111;border-radius:50%;transform:translateX(-50%)}
          .s1{left:72px;top:96px;height:44px;transform:rotate(-71deg)}
          .s2{left:101px;top:68px;height:46px;transform:rotate(-37deg)}
          .s3{left:128px;top:49px;height:52px;transform:rotate(0deg)}
          .s4{right:101px;top:68px;height:46px;transform:rotate(37deg)}
          .s5{right:72px;top:96px;height:44px;transform:rotate(71deg)}
          .s6{right:72px;top:122px;height:28px;transform:rotate(92deg)}'''
              s, n = old_css_pattern.subn(new_css, s, count=1)
              if n != 1:
                  raise SystemExit('level 10 css block not found')

              stage10_pattern = re.compile(
                  r"if\(stage===10\)\{evolution\.innerHTML=.*?pet\.setAttribute\('aria-label','まわりに小さな目が生えた目玉'\);\}",
                  re.S,
              )
              stage10 = '''if(stage===10){evolution.innerHTML='<i class="bud-stem s1"></i><i class="bud-stem s2"></i><i class="bud-stem s3"></i><i class="bud-stem s4"></i><i class="bud-stem s5"></i><i class="bud-stem s6"></i>'+eye('bud-eye b1')+eye('bud-eye b2')+eye('bud-eye b3')+eye('bud-eye b4')+eye('bud-eye b5')+eye('bud-eye b6');status.textContent='なんだか、よくみえる。';help.innerHTML='たくさん食べて、進化したみたい。<br>目玉から、にょきにょき生えてきた。';next.textContent='20こで次の進化。';pet.setAttribute('aria-label','大きな目玉から小さな目玉がにょきにょき生えた目玉');}'''
              s, n = stage10_pattern.subn(stage10, s, count=1)
              if n != 1:
                  raise SystemExit('level 10 render block not found')

              p.write_text(s)
          PY
      - name: Commit source patch if needed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Make level 10 eyes sprout from main eye"
            git push
          fi
      - name: Prepare the current site
        run: |
          mkdir -p public
          cp index.html public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
