name: Deploy Water Blue Shiten
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the current site
        run: |
          mkdir -p public
          cp index.html public/index.html
      - name: Refine final evolution wings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.html')
          s = p.read_text()
          replacement = r'''.wing{position:absolute;width:60px;height:30px;background:#fff;border:3px solid #111;border-radius:72% 98% 68% 42%/58% 64% 52% 48%;z-index:3;transform-origin:14% 50%}.wing:before,.wing:after{content:'';position:absolute;background:#fff;border:2px solid #111;border-radius:76% 96% 72% 46%/58% 64% 52% 48%;z-index:-1;transform-origin:10% 50%}.wing:before{width:43px;height:19px;left:5px;top:-11px;transform:rotate(-12deg)}.wing:after{width:39px;height:17px;left:8px;bottom:-10px;transform:rotate(12deg)}.w-left{left:29px;top:86px;transform:rotate(180deg)}.w-right{right:29px;top:86px}.w-top{left:105px;top:18px;transform:rotate(-90deg)}.w-bottom{left:105px;bottom:18px;transform:rotate(90deg)}'''
          pattern = r'\.wing\{.*?\.w-bottom\{[^}]*\}'
          s, n = re.subn(pattern, lambda m: replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('wing css block not found')
          marker = '.stage-30 .room-scene{'
          if marker in s and '.stage-30 .room-evolution{top:43%' not in s:
              s = s.replace(marker, '.stage-30 .room-evolution{top:43%;transform:translate(-50%,-50%) scale(.84)}.stage-30 .room-pet{top:43%}'+marker, 1)
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
