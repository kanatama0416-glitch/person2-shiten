name: Deploy Water Blue Shiten

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate site
        run: node build-stage10.js

      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium

      - name: Verify mobile pet behavior in Chrome
        run: |
          python -m http.server 8000 --directory public >/tmp/shiten-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python browser-check.py

      - name: Upload local browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots-local
          path: browser-check-screenshots
          if-no-files-found: ignore

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed GitHub Pages in Chrome
        env:
          SHITEN_TEST_URL: ${{ steps.deployment.outputs.page_url }}
          SHITEN_SCREEN_DIR: deployed-browser-check-screenshots
        run: python browser-check.py

      - name: Upload deployed browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots-deployed
          path: deployed-browser-check-screenshots
          if-no-files-found: ignore
